<title>AI-901 Practice Exam</title>
<style>
/* Layout: exam-console — fixed top bar, question pane, fixed bottom nav, like a testing center UI */
:root{
  --bg:#f3f2f1;--panel:#ffffff;--fg:#323130;--muted:#605e5c;--line:#c8c6c4;
  --bar:#2a4464;--bar-fg:#ffffff;--accent:#2a4464;--accent-soft:#e8eef5;--side:#f3f2f1;--sel:#deecf9;--note:#fff8c5;--note-line:#e8d77a;
  --flag:#c25e00;--good:#107c10;--bad:#a4262c;--code:#f6f8fa;
  --font:"Segoe UI","Segoe UI Web (West European)",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",sans-serif;--mono:Consolas,'JetBrains Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1b1a19;--panel:#252423;--fg:#f3f2f1;--muted:#c8c6c4;--line:#484644;
  --bar:#1b1a19;--bar-fg:#f3f2f1;--accent:#8fb3dd;--accent-soft:#2b3a4c;--side:#201f1e;--sel:#2b3a4c;--note:#3d3820;--note-line:#7a6c2a;
  --flag:#f0a050;--good:#6ccb5f;--bad:#f1707b;--code:#1b1a19;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1b1a19;--panel:#252423;--fg:#f3f2f1;--muted:#c8c6c4;--line:#484644;
  --bar:#1b1a19;--bar-fg:#f3f2f1;--accent:#8fb3dd;--accent-soft:#2b3a4c;--side:#201f1e;--sel:#2b3a4c;--note:#3d3820;--note-line:#7a6c2a;
  --flag:#f0a050;--good:#6ccb5f;--bad:#f1707b;--code:#1b1a19;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);color:var(--bar-fg);
  display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top b{font-weight:600}
.top .meta{display:flex;gap:18px;align-items:center;font-variant-numeric:tabular-nums;font-size:14px}
.timer{font-family:var(--mono);font-size:15px;padding:3px 10px;border:1px solid rgba(255,255,255,.35);border-radius:4px}
.timer.low{background:var(--bad);border-color:var(--bad)}
.progress{height:4px;background:var(--line)}.progress>i{display:block;height:100%;background:var(--accent);transition:width .2s}
main{max-width:920px;margin:0 auto;padding-block:24px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:24px}
h1{font-size:24px;margin:0 0 6px;text-wrap:balance}h2{font-size:18px;margin:0 0 12px}
.muted{color:var(--muted)}
.qhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-bottom:14px;text-transform:uppercase;letter-spacing:.04em}
.qtext{font-size:16px;margin:0 0 18px;white-space:pre-wrap}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:4px;margin-bottom:8px;cursor:pointer;background:var(--panel)}
.opt:hover{border-color:var(--accent)}.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt input{margin-top:3px;accent-color:var(--accent)}
.opt.right{border-color:var(--good)}.opt.wrong{border-color:var(--bad)}
table.yn{width:100%;border-collapse:collapse}table.yn th,table.yn td{border:1px solid var(--line);padding:10px;text-align:left;vertical-align:top}
table.yn th{background:var(--accent-soft);font-weight:600}table.yn td.c{text-align:center;width:64px}
pre.code{background:var(--code);border:1px solid var(--line);border-radius:4px;padding:14px;font-family:var(--mono);font-size:13px;overflow-x:auto;white-space:pre;line-height:1.9}
.slot{display:inline-block;min-width:110px;padding:1px 8px;border:1px dashed var(--accent);border-radius:3px;color:var(--accent);background:var(--accent-soft);cursor:pointer;text-align:center}
.slot.filled{border-style:solid;color:var(--fg)}.slot.active{outline:2px solid var(--accent)}
.dd{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media (max-width:640px){.dd{grid-template-columns:1fr}}
.dd>div{min-width:0}.dd h3{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 8px}
.tok{padding:9px 12px;border:1px solid var(--line);border-radius:4px;margin-bottom:6px;background:var(--panel);cursor:grab;font-family:var(--mono);font-size:13px}
.tok:hover,.tok.picked{border-color:var(--accent);background:var(--accent-soft)}
.tgt{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}.tgt span{font-size:13px;color:var(--muted)}
.tgt .drop{min-height:40px;padding:8px 12px;border:1px dashed var(--accent);border-radius:4px;cursor:pointer;font-family:var(--mono);font-size:13px}
.tgt .drop.filled{border-style:solid;background:var(--accent-soft)}.tgt .drop.over{background:var(--accent-soft)}
.hint{font-size:13px;color:var(--muted);margin-top:10px}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
  padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.foot .grp{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:inherit;font-weight:500;padding:9px 18px;border-radius:4px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
button:hover{border-color:var(--accent)}button:focus-visible,.opt:focus-within,.slot:focus-visible,.tok:focus-visible,.drop:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
label.flag{display:flex;gap:8px;align-items:center;cursor:pointer;font-weight:500}label.flag input{accent-color:var(--flag)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:14px}
.cell{padding:10px;border:1px solid var(--line);border-radius:4px;cursor:pointer;font-size:13px;display:flex;justify-content:space-between;gap:6px;font-variant-numeric:tabular-nums}
.cell:hover{border-color:var(--accent)}.cell.un{border-left:4px solid var(--bad)}.cell.fl .f{color:var(--flag)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.score{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-end;margin:12px 0 20px}
.score .n{font-size:48px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.pass{color:var(--good)}.fail{color:var(--bad)}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--accent)}
.dom{margin-bottom:14px}.dom div:first-child{display:flex;justify-content:space-between;font-size:14px}
.exp{margin-top:14px;padding:12px 14px;border-left:3px solid var(--accent);background:var(--accent-soft);font-size:14px}
.badge{font-size:12px;font-weight:600;padding:2px 8px;border-radius:10px;border:1px solid currentColor}
ul.rules{padding-left:20px}ul.rules li{margin-bottom:4px}
.stack{display:flex;flex-direction:column;gap:16px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.top .tr{display:flex;gap:14px;align-items:center}
.thm{padding:5px 10px;font-size:13px;background:transparent;color:var(--bar-fg);border-color:rgba(255,255,255,.4)}
.thm:hover{background:rgba(255,255,255,.12)}
[hidden]{display:none!important}
.cta{border-color:var(--accent);background:linear-gradient(135deg,var(--accent-soft),var(--panel) 70%)}
.cta .row{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
a.btn{display:inline-block;font-weight:600;padding:9px 18px;border-radius:4px;background:var(--accent);color:#fff;text-decoration:none;white-space:nowrap}
a.btn:hover{filter:brightness(1.08)}
.top a.nav{color:var(--bar-fg);font-size:14px;text-decoration:none;opacity:.9}.top a.nav:hover{opacity:1;text-decoration:underline}
/* ===== exam console ===== */
body{font-size:15px}
h1,h2{color:var(--accent);font-weight:600}h1{font-size:28px}
.card{border-radius:8px;border-color:var(--line)}
button{border-radius:0;font-weight:600}button.pri{background:var(--accent);border-color:var(--accent)}
:root[data-theme="dark"] button.pri,:root[data-theme="dark"] a.btn{color:#1b1a19}
a.btn{border-radius:0}
body.exam{background:var(--panel)}
body.exam .top,body.exam .progress{display:none!important}
body.exam main{max-width:none;margin:0 0 0 var(--sw);padding:16px 28px 96px}
body.exam .foot{left:var(--sw);border-top:0;background:var(--panel);justify-content:flex-start;padding-left:28px}

#side{display:none}
body.exam #side{display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;width:var(--sw);background:var(--side);border-right:1px solid var(--line);z-index:6;overflow:hidden}
#side .sh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;font-weight:600;font-size:14px}
#side button{all:unset;box-sizing:border-box;display:flex;gap:14px;align-items:center;width:100%;padding:12px 16px;cursor:pointer;font-size:15px;font-weight:500;color:var(--fg);white-space:nowrap}
#side button:hover{background:var(--line)}#side button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
#side .ic{flex:none;width:22px;text-align:center;font-size:18px}

body.mini #side .lb,body.mini #side .ttl{display:none}body.mini #side .sh{justify-content:center;padding:14px 0}
.xh{display:grid;grid-template-columns:auto 1fr auto;gap:24px;align-items:end;margin-bottom:16px}
.xh .xq{font-size:20px;font-weight:700;align-self:center}
.xh .xp{justify-self:center;width:min(420px,100%);font-size:12px;color:var(--muted)}
.xh .xp .lbl{text-align:center;letter-spacing:.04em;margin-bottom:4px}
.xh .xp .trk{height:8px;border-radius:4px;background:var(--line);overflow:hidden}.xh .xp .trk i{display:block;height:100%;background:var(--accent)}
.xh .xp .sm{display:flex;justify-content:space-between;margin-top:3px}
.xh .xt{text-align:right;font-size:13px;letter-spacing:.04em;color:var(--fg)}
.xh .xt b{display:block;font-size:26px;font-weight:400;letter-spacing:.06em;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1.1}
.xh .xt b.low{color:var(--bad)}
.qbox{border:1px solid var(--line);background:var(--panel);padding:22px 24px}
.qbox .qtext{font-size:15px}
.opt{border:0;padding:8px 4px;margin:0 0 4px;background:transparent;align-items:center;border-radius:2px}
.opt:hover{background:var(--side)}.opt.sel{background:var(--sel)}
.opt input{width:20px;height:20px;margin:0;accent-color:var(--accent)}
.opt .lt{font-weight:600;min-width:20px}
.opt.right{background:transparent;color:var(--good)}.opt.wrong{background:transparent;color:var(--bad)}
.qtools{margin-top:18px;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
button.rst{background:#605e5c;color:#fff;border:0;border-radius:16px;padding:5px 14px;font-weight:500;font-size:14px}
button.rst:hover{background:#484644}
label.flag{font-weight:400}label.flag input{width:18px;height:18px;accent-color:var(--accent)}
.foot button{min-width:192px;padding:9px 12px;border:1px solid var(--accent);color:var(--accent);background:var(--panel)}
.foot button.pri{color:#fff;background:var(--accent)}
.foot button:hover{filter:brightness(1.1)}
.dd h3{font-size:15px;text-transform:none;letter-spacing:0;color:var(--fg);font-weight:600}
.tok{border-color:var(--accent);border-radius:0;font-family:var(--font);font-size:14px}.tok::before{content:"\2807  ";color:var(--muted)}
.tgt .drop,.slot{border-radius:0}.tgt .drop{font-family:var(--font);font-size:14px;background:var(--panel)}
.ddarea{background:var(--side);padding:12px;min-height:120px}
.note{background:var(--note);border:1px solid var(--note-line);padding:12px 16px;margin-bottom:16px;font-size:14px}
.note b{display:block;margin-bottom:4px}.note ul{margin:0;padding-left:20px}
.filt{display:flex;gap:18px;flex-wrap:wrap;align-items:center;padding:10px 12px;border:1px solid var(--line);border-bottom:0;background:var(--side);font-size:14px}
.filt label{display:flex;gap:6px;align-items:center;cursor:pointer}.filt input{accent-color:var(--accent);width:16px;height:16px}
table.rv{width:100%;border-collapse:collapse;font-size:14px}
table.rv th,table.rv td{border:1px solid var(--line);padding:9px 10px;text-align:left;vertical-align:top}
table.rv th{font-weight:600;background:var(--panel)}table.rv td.c,table.rv th.c{text-align:center;width:110px}
table.rv tr.row{cursor:pointer}table.rv tr.row:hover td{background:var(--sel)}
table.rv .qt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
table.rv tr.row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:grid;place-items:center;z-index:20;padding:16px}
.dlg>div{background:var(--panel);max-width:520px;padding:22px 24px;box-shadow:0 6px 24px rgba(0,0,0,.3)}
.dlg h2{color:var(--fg);font-size:17px}.dlg .grp{display:flex;gap:10px;margin-top:16px}
.dlg button{min-width:110px;border:1px solid var(--accent);background:var(--accent);color:#fff;padding:6px 12px}
@media (max-width:760px){
  body.exam,body.exam.mini{--sw:0px}
  body.exam #side{position:sticky;top:0;bottom:auto;width:auto;height:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
  body.exam #side .sh,body.exam #side hr{display:none}
  body.exam main{padding:12px 16px 96px}body.exam .foot{padding-left:16px}
  .xh{grid-template-columns:1fr auto}.xh .xp{grid-column:1/-1;grid-row:2;justify-self:stretch;width:auto}

}
:root[data-theme="dark"] .foot button.pri,:root[data-theme="dark"] .dlg button{color:#1b1a19}

<div class="top" id="top">
  <div><b>AI-901 Practice Exam</b> <span style="opacity:.75">· Azure AI Fundamentals · unofficial simulator</span></div>
  <div class="tr"><div class="meta" id="meta"></div><a class="nav" href="/course">Course</a><button id="theme" class="thm" type="button" aria-label="Switch theme"></button></div>
</div>
<div class="progress" id="prog" hidden><i id="progi"></i></div>
<aside id="side" aria-label="Toolbar">
  <div class="sh"><span class="ttl">Toolbar</span><button id="mini" type="button" aria-label="Collapse toolbar" title="Collapse toolbar">&laquo;</button></div>
  <button id="s-rev" type="button"><span class="ic">&#9776;</span><span class="lb">Review</span></button>
  <hr>
  <button id="s-thm" type="button"><span class="ic">&#9788;</span><span class="lb">Color Scheme</span></button>
  <button id="s-help" type="button"><span class="ic">?</span><span class="lb">Help</span></button>
  <button id="s-end" type="button"><span class="ic">&#9873;</span><span class="lb">End Exam</span></button>
</aside>
<main id="app"></main>
<div class="foot" id="foot" hidden></div>

<script>
const EXAM_LEN=45, EXAM_MIN=45, PASS=700;
let BANK=[], S=null, tick=null, reviewFilter='all', picked=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

async function load(){
  try{const r=await fetch('questions.json');BANK=await r.json()}catch(e){$('#app').innerHTML='<div class="card">Could not load the question bank. Refresh to try again.</div>';return}
  home();
}

function home(){
  document.body.classList.remove('exam');S=null;
  clearInterval(tick);$('#meta').innerHTML='';$('#foot').hidden=true;$('#prog').hidden=true;
  const d1=BANK.filter(q=>q.d===1).length,d2=BANK.length-d1;
  const types={single:'Multiple choice',multi:'Multiple response',yesno:'Yes / No series',drag:'Drag and drop / code completion'};
  const counts={};BANK.forEach(q=>counts[q.t]=(counts[q.t]||0)+1);
  $('#app').innerHTML=`<div class="stack">
  <div class="card"><h1>Welcome to the AI-901 practice exam</h1>
  <p class="muted">Microsoft Azure AI Fundamentals. This simulator mirrors the flow of a proctored certification exam: timed questions, Review Later flags, a review screen, and a scaled score report.</p>
  <div class="score"><div><div class="n">${EXAM_LEN}</div><div class="muted">questions</div></div>
  <div><div class="n">${EXAM_MIN}</div><div class="muted">minutes</div></div>
  <div><div class="n">${PASS}</div><div class="muted">passing score / 1000</div></div>
  <div><div class="n">${BANK.length}</div><div class="muted">questions in bank</div></div></div>
  <h2>Instructions</h2><ul class="rules">
  <li>Each attempt draws a new set from the bank, weighted like the real exam: Domain 1 about 42%, Domain 2 about 58%.</li>
  <li>Use <b>Next</b> and <b>Previous</b> to move. Tick <b>Review later</b> to flag a question.</li>
  <li>Open the <b>Review screen</b> any time to jump to unanswered or flagged items.</li>
  <li>Multiple-response and drag-and-drop items need every part correct to score.</li>
  <li>When time runs out, the exam ends and is scored automatically.</li></ul>
  <label class="flag" style="margin:16px 0"><input type="checkbox" id="agree"> I understand this is an unofficial practice test, not affiliated with Microsoft, and contains no real exam content.</label>
  <button class="pri" id="start" disabled>Start exam</button></div>
  <div class="card cta"><div class="row"><div><span class="badge" style="color:var(--accent)">COMING SOON</span><h2 style="margin:8px 0 4px">AI-901 prep course: 8 one-hour sessions</h2><p class="muted" style="margin:0">Every official skill from the April 2026 outline, with hands-on Microsoft Foundry labs and a full mock exam. Includes links to the free <a href="/course#official" style="color:var(--accent)">official Microsoft Learn content</a>.</p></div><a class="btn" href="/course">See the course</a></div></div>
  <div class="card"><h2>Question bank</h2>
  <p class="muted">Identify AI concepts and capabilities: ${d1} · Implement AI solutions with Microsoft Foundry: ${d2}</p>
  <div class="grid">${Object.entries(types).map(([k,v])=>`<div class="cell"><span>${v}</span><b>${counts[k]||0}</b></div>`).join('')}</div></div></div>`;
  $('#agree').onchange=e=>$('#start').disabled=!e.target.checked;
  $('#start').onclick=start;
}

function start(){
  const n1=Math.round(EXAM_LEN*0.42);
  const p1=shuffle(BANK.filter(q=>q.d===1)),p2=shuffle(BANK.filter(q=>q.d===2));
  let set=[...p1.slice(0,n1),...p2.slice(0,EXAM_LEN-n1)];
  if(set.length<EXAM_LEN)set=[...set,...shuffle([...p1.slice(n1),...p2.slice(EXAM_LEN-n1)])].slice(0,EXAM_LEN);
  set=set.sort((a,b)=>a.d-b.d);
  S={qs:set.map(q=>({q,ans:null,flag:false})),i:0,end:Date.now()+EXAM_MIN*60000,done:false};
  clearInterval(tick);tick=setInterval(timer,1000);timer();
  document.body.classList.add('exam');$('#prog').hidden=false;show();
}

function timer(){
  if(!S||S.done)return;
  const left=Math.max(0,S.end-Date.now()),m=Math.floor(left/60000),s=Math.floor(left%60000/1000);
  const ans=S.qs.filter(x=>answered(x)).length;
  $('#meta').innerHTML=`<span>Question ${S.i+1} of ${S.qs.length}</span><span>Answered ${ans}</span><span class="timer ${left<300000?'low':''}" aria-label="Time remaining">${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}</span>`;
  $('#progi').style.width=((S.i+1)/S.qs.length*100)+'%';
  const xh=$('#xh');if(xh){const p=Math.round(ans/S.qs.length*100);
    xh.innerHTML=`<div class="xq">${S.view==='review'?'Question Review':'Question '+(S.i+1)}</div>
    <div class="xp"><div class="lbl">PROGRESS</div><div class="trk"><i style="width:${p}%"></i></div><div class="sm"><span>Answered ${ans}/${S.qs.length}</span><span>${S.qs.filter(x=>x.flag).length} for review</span></div></div>
    <div class="xt">TIME REMAINING<b class="${left<300000?'low':''}" aria-label="Time remaining">${String(Math.floor(m/60)).padStart(2,'0')} : ${String(m%60).padStart(2,'0')} : ${String(s).padStart(2,'0')}</b></div>`}
  if(left<=0)finish();
}

function answered(x){
  const a=x.ans,t=x.q.t;if(a==null)return false;
  if(t==='single')return a.length===1;
  if(t==='multi')return a.length>0;
  if(t==='yesno')return a.every(v=>v!==null);
  if(t==='drag')return a.every(v=>v!==null);
  return false;
}

function blankAns(q){
  if(q.t==='yesno')return q.st.map(()=>null);
  if(q.t==='drag')return q.bl.map(()=>null);
  return [];
}

function show(){
  closeDlg();S.view='q';picked=null;const x=S.qs[S.i],q=x.q;if(!x.ans)x.ans=blankAns(q);
  const dom=q.d===1?'Identify AI concepts and capabilities':'Implement AI solutions by using Microsoft Foundry';
  let body='';
  if(q.t==='single'||q.t==='multi'){
    const multi=q.t==='multi';
    body=(multi?`<p class="hint" style="margin-top:-8px">Select ${q.n} answers.</p>`:'')+q.o.map((o,k)=>`<label class="opt ${x.ans.includes(k)?'sel':''}"><input type="${multi?'checkbox':'radio'}" name="o" id="o${k}" value="${k}" ${x.ans.includes(k)?'checked':''}><span class="lt">${'ABCDEFGH'[k]}.</span><span>${esc(o)}</span></label>`).join('');
  } else if(q.t==='yesno'){
    body=`<div style="overflow-x:auto"><table class="yn"><tr><th>Statement</th><th class="c">Yes</th><th class="c">No</th></tr>${q.st.map((s,k)=>`<tr><td>${esc(s[0])}</td><td class="c"><input type="radio" name="y${k}" id="y${k}y" data-k="${k}" data-v="1" ${x.ans[k]===true?'checked':''} aria-label="Yes"></td><td class="c"><input type="radio" name="y${k}" id="y${k}n" data-k="${k}" data-v="0" ${x.ans[k]===false?'checked':''} aria-label="No"></td></tr>`).join('')}</table></div>`;
  } else if(q.t==='drag'){
    const pool=`<h3>${q.code?'Code segments':'Actions'}</h3>${q.tk.map((t,k)=>`<div class="tok" draggable="true" tabindex="0" data-t="${k}">${esc(t)}</div>`).join('')}`;
    if(q.code){
      let c=esc(q.code).replace(/\[(\d)\]/g,(m,n)=>{const i=+n-1,v=x.ans[i];return `<span class="slot ${v!=null?'filled':''}" tabindex="0" data-b="${i}">${v!=null?esc(q.tk[v]):q.bl[i]}</span>`});
      body=`<pre class="code">${c}</pre><div class="dd"><div>${pool}</div><div><h3>How to answer</h3><p class="muted" style="font-size:14px">Drag a segment onto a box in the code, or click a segment and then click a box. Click a filled box to clear it. Each segment may be used once, more than once, or not at all.</p></div></div>`;
    } else {
      body=`<div class="dd"><div>${pool}</div><div><h3>Answer Area</h3><div class="ddarea">${q.bl.map((b,i)=>{const v=x.ans[i];return `<div class="tgt"><span>${esc(b)}</span><div class="drop ${v!=null?'filled':''}" tabindex="0" data-b="${i}">${v!=null?esc(q.tk[v]):'&nbsp;'}</div></div>`}).join('')}</div></div></div><p class="hint">Drag, or click an item then click a box. Click a filled box to clear it.</p>`;
    }
  }
  $('#app').innerHTML=`<div id="xh" class="xh"></div><div class="qbox"><div class="qhead"><span>${dom}</span><span>${({single:'Multiple choice',multi:'Multiple response',yesno:'Yes / No',drag:'Drag and drop'})[q.t]}</span></div><p class="qtext">${esc(q.q)}</p>${body}
  <div class="qtools"><button class="rst" id="rst" type="button">&#8634; Reset Answer</button><label class="flag"><input type="checkbox" id="flg" ${x.flag?'checked':''}> Review later</label></div></div>`;
  wire(x,q);
  $('#foot').hidden=false;
  $('#foot').innerHTML=`<div class="grp"><button id="prev" ${S.i===0?'disabled':''}>&lsaquo;&nbsp; Previous</button><button id="next" class="pri">${S.i===S.qs.length-1?'Review':'Next'} &nbsp;&rsaquo;</button></div>`;
  $('#flg').onchange=e=>{x.flag=e.target.checked;timer()};
  $('#rst').onclick=()=>{x.ans=blankAns(q);show()};
  $('#prev').onclick=()=>{S.i--;show();timer()};
  $('#next').onclick=()=>{if(S.i===S.qs.length-1)toReview();else{S.i++;show();timer()}};
  window.scrollTo(0,0);timer();
}

function wire(x,q){
  if(q.t==='single'||q.t==='multi'){
    document.querySelectorAll('.opt input').forEach(inp=>inp.onchange=()=>{
      const k=+inp.value;
      if(q.t==='single')x.ans=[k];
      else x.ans=inp.checked?[...new Set([...x.ans,k])]:x.ans.filter(v=>v!==k);
      document.querySelectorAll('.opt').forEach((el,j)=>el.classList.toggle('sel',x.ans.includes(j)));timer();
    });
  } else if(q.t==='yesno'){
    document.querySelectorAll('table.yn input').forEach(inp=>inp.onchange=()=>{x.ans[+inp.dataset.k]=inp.dataset.v==='1';timer()});
  } else if(q.t==='drag'){
    const place=(b,t)=>{x.ans[b]=t;show()};
    document.querySelectorAll('.tok').forEach(el=>{
      el.ondragstart=e=>e.dataTransfer.setData('text/plain',el.dataset.t);
      el.onclick=()=>{picked=+el.dataset.t;document.querySelectorAll('.tok').forEach(t=>t.classList.toggle('picked',t===el))};
      el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();el.click()}};
    });
    document.querySelectorAll('[data-b]').forEach(el=>{
      const b=+el.dataset.b;
      el.ondragover=e=>{e.preventDefault();el.classList.add('over')};
      el.ondragleave=()=>el.classList.remove('over');
      el.ondrop=e=>{e.preventDefault();place(b,+e.dataTransfer.getData('text/plain'))};
      el.onclick=()=>{if(picked!=null)place(b,picked);else if(x.ans[b]!=null)place(b,null)};
      el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();el.click()}};
    });
  }
}

function toReview(){
  const x=S.qs[S.i];if(S.view==='q'&&!answered(x)){dlg('Incomplete Question Warning','You have not selected an answer for this question or have not selected enough answers. Select OK to proceed to the review screen although this question is incomplete. Select Cancel to remain on the question.',[['Cancel',closeDlg],['OK',()=>{closeDlg();review()}]]);return}
  review();
}
function review(){
  closeDlg();S.view='review';
  const has=f=>S.qs.filter(f).length,an=has(answered),un=S.qs.length-an,fl=has(x=>x.flag);
  const list=S.qs.map((x,i)=>({x,i})).filter(({x})=>reviewFilter==='all'||(reviewFilter==='an'&&answered(x))||(reviewFilter==='un'&&!answered(x))||(reviewFilter==='fl'&&x.flag));
  const ck=v=>v?'&#10004;':'';
  const opt=(k,l,n)=>`<label><input type="radio" name="rf" value="${k}" ${reviewFilter===k?'checked':''} ${n?'':'disabled'}> ${l} (${n})</label>`;
  $('#app').innerHTML=`<div id="xh" class="xh"></div>
  <div class="note"><b>Review Screen Instructions</b><ul><li>Below is a table showing all questions.</li><li>Select a question to return to it. Unanswered questions are scored as incorrect.</li><li>Select <b style="display:inline">Finish Exam</b> when you are ready. You can't change answers afterwards.</li></ul></div>
  <div class="filt"><span>Filter By:</span>${opt('all','All',S.qs.length)}${opt('an','Answered',an)}${opt('un','Unanswered',un)}${opt('fl','For Review',fl)}</div>
  <div style="overflow-x:auto"><table class="rv"><tr><th style="width:40px"></th><th>Question</th><th class="c">Answered</th><th class="c">Unanswered</th><th class="c">For Review</th></tr>
  ${list.map(({x,i})=>`<tr class="row" tabindex="0" data-i="${i}"><td>${i+1}</td><td><span class="qt">${esc(x.q.q)}</span></td><td class="c">${ck(answered(x))}</td><td class="c">${ck(!answered(x))}</td><td class="c">${ck(x.flag)}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">No questions match this filter.</td></tr>'}</table></div>`;
  document.querySelectorAll('input[name=rf]').forEach(r=>r.onchange=()=>{reviewFilter=r.value;review()});
  document.querySelectorAll('tr.row').forEach(c=>{c.onclick=()=>{S.i=+c.dataset.i;show()};c.onkeydown=e=>{if(e.key==='Enter')c.click()}});
  $('#foot').hidden=false;
  $('#foot').innerHTML=`<div class="grp"><button id="back">&lsaquo;&nbsp; Return to Question ${S.i+1}</button><button class="pri" id="fin">Finish Exam &nbsp;&#8677;</button></div>`;
  $('#back').onclick=show;
  $('#fin').onclick=endExam;
  timer();
}
function endExam(){
  const un=S.qs.filter(x=>!answered(x)).length;
  dlg('End Exam',(un?`You have ${un} unanswered question${un>1?'s':''}. `:'')+'After you finish, you cannot return to the exam. Do you want to finish now?',[['Cancel',closeDlg],['Finish Exam',finish]]);
}
function dlg(t,msg,btns){
  closeDlg();const d=document.createElement('div');d.className='dlg';d.id='dlg';d.setAttribute('role','dialog');d.setAttribute('aria-modal','true');
  d.innerHTML=`<div><h2>${t}</h2><p style="margin:0">${msg}</p><div class="grp">${btns.map((b,i)=>`<button data-k="${i}">${b[0]}</button>`).join('')}</div></div>`;
  document.body.appendChild(d);d.querySelectorAll('button').forEach(b=>b.onclick=btns[+b.dataset.k][1]);d.querySelector('button').focus();
  d.onkeydown=e=>{if(e.key==='Escape')closeDlg()};
}
function closeDlg(){const d=$('#dlg');d&&d.remove()}
function sideWire(){
  let mini=false;try{mini=localStorage.getItem('mini')==='1'}catch(e){}
  document.body.classList.toggle('mini',mini);
  $('#mini').onclick=()=>{const m=document.body.classList.toggle('mini');$('#mini').innerHTML=m?'&raquo;':'&laquo;';try{localStorage.setItem('mini',m?'1':'0')}catch(e){}};
  $('#mini').innerHTML=mini?'&raquo;':'&laquo;';
  $('#s-rev').onclick=()=>S&&!S.done&&toReview();
  $('#s-thm').onclick=()=>$('#theme').click();
  $('#s-end').onclick=()=>S&&!S.done&&endExam();
  $('#s-help').onclick=()=>dlg('Help','Select an answer, then use Next and Previous to move. Tick Review later to flag a question. Drag-and-drop: drag an item onto a box, or click an item and then a box; click a filled box to clear it. Open Review from the toolbar to see every question, and End Exam to score.',[['OK',closeDlg]]);
}

function correct(x){
  const q=x.q,a=x.ans;if(!answered(x))return false;
  if(q.t==='single'||q.t==='multi')return a.length===q.a.length&&q.a.every(v=>a.includes(v));
  if(q.t==='yesno')return q.st.every((s,k)=>a[k]===s[1]);
  if(q.t==='drag')return q.a.every((v,k)=>a[k]===v);
}

function finish(){
  S.done=true;clearInterval(tick);document.body.classList.remove('exam');closeDlg();
  const r=S.qs.map(correct),tot=r.filter(Boolean).length;
  const score=Math.round(tot/S.qs.length*1000),ok=score>=PASS;
  const dom=d=>{const idx=S.qs.map((x,i)=>i).filter(i=>S.qs[i].q.d===d);const c=idx.filter(i=>r[i]).length;return{c,n:idx.length,p:idx.length?Math.round(c/idx.length*100):0}};
  const D1=dom(1),D2=dom(2);
  const skills={};S.qs.forEach((x,i)=>{const s=x.q.s;skills[s]=skills[s]||{c:0,n:0};skills[s].n++;if(r[i])skills[s].c++});
  $('#meta').innerHTML='<span>Exam complete</span>';$('#prog').hidden=true;
  $('#app').innerHTML=`<div class="stack"><div class="card"><h1>Score report</h1>
  <div class="score"><div><div class="n ${ok?'pass':'fail'}">${score}</div><div class="muted">your score / 1000</div></div>
  <div><span class="badge ${ok?'pass':'fail'}">${ok?'PASS':'FAIL'}</span><div class="muted" style="margin-top:6px">Passing score: ${PASS} · ${tot} of ${S.qs.length} correct</div></div></div>
  <h2>By domain</h2>
  ${[['Identify AI concepts and capabilities',D1],['Implement AI solutions by using Microsoft Foundry',D2]].map(([n,v])=>`<div class="dom"><div><span>${n}</span><b>${v.c}/${v.n} · ${v.p}%</b></div><div class="bar"><i style="width:${v.p}%"></i></div></div>`).join('')}
  <h2 style="margin-top:20px">By skill</h2>
  ${Object.entries(skills).map(([n,v])=>{const p=Math.round(v.c/v.n*100);return `<div class="dom"><div><span>${esc(n)}</span><b>${v.c}/${v.n}</b></div><div class="bar"><i style="width:${p}%"></i></div></div>`}).join('')}
  <p class="muted" style="font-size:13px">Practice scores are a simple percentage scaled to 1000. Real exam scoring is weighted and not published.</p></div>
  ${ok?`<div class="card cta"><div class="row"><div><span class="badge" style="color:var(--accent)">COMING SOON</span><h2 style="margin:8px 0 4px">Go deeper with the AI-901 course</h2><p class="muted" style="margin:0">Passed the practice test? The course adds the Foundry labs and Python SDK practice the real exam expects.</p></div><a class="btn" href="/course">See the course</a></div></div>`:`<div class="card cta"><div class="row"><div><span class="badge" style="color:var(--accent)">COMING SOON</span><h2 style="margin:8px 0 4px">Not there yet? Take the AI-901 course</h2><p class="muted" style="margin:0">8 one-hour sessions that walk through every exam skill, with labs, exam traps and a full mock exam.</p></div><a class="btn" href="/course">See the course</a></div></div>`}
  <div class="card"><h2>Answer review</h2><div id="ar" class="stack"></div></div></div>`;
  $('#ar').innerHTML=S.qs.map((x,i)=>reviewItem(x,i,r[i])).join('');
  $('#foot').hidden=false;$('#foot').innerHTML=`<span class="muted">New attempts draw a fresh set of questions.</span><div class="grp"><button id="home">Home</button><button class="pri" id="again">Start new exam</button></div>`;
  $('#home').onclick=home;$('#again').onclick=start;window.scrollTo(0,0);
}

function reviewItem(x,i,ok){
  const q=x.q,a=x.ans||[];let body='';
  if(q.t==='single'||q.t==='multi')body=q.o.map((o,k)=>`<div class="opt ${q.a.includes(k)?'right':a.includes(k)?'wrong':''}" style="cursor:default">${q.a.includes(k)?'✓':a.includes(k)?'✗':'·'} <span>${esc(o)}${a.includes(k)?' <span class="muted">(your answer)</span>':''}</span></div>`).join('');
  if(q.t==='yesno')body=`<div style="overflow-x:auto"><table class="yn"><tr><th>Statement</th><th class="c">Correct</th><th class="c">Yours</th></tr>${q.st.map((s,k)=>`<tr><td>${esc(s[0])}</td><td class="c">${s[1]?'Yes':'No'}</td><td class="c ${a[k]===s[1]?'pass':'fail'}">${a[k]==null?'—':a[k]?'Yes':'No'}</td></tr>`).join('')}</table></div>`;
  if(q.t==='drag')body=`<div style="overflow-x:auto"><table class="yn"><tr><th>Box</th><th>Correct</th><th>Yours</th></tr>${q.bl.map((b,k)=>`<tr><td>${esc(b)}</td><td>${esc(q.tk[q.a[k]])}</td><td class="${a[k]===q.a[k]?'pass':'fail'}">${a[k]==null?'—':esc(q.tk[a[k]])}</td></tr>`).join('')}</table></div>`;
  return `<div><div class="qhead"><span>Question ${i+1} · ${esc(q.s)}</span><span class="${ok?'pass':'fail'}">${ok?'Correct':'Incorrect'}</span></div><p class="qtext">${esc(q.q)}</p>${q.code?`<pre class="code">${esc(q.code)}</pre>`:''}${body}<div class="exp">${esc(q.e)}</div></div>`;
}

(function(){
  const root=document.documentElement,btn=$('#theme');
  const sys=()=>matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
  let t=null;try{t=localStorage.getItem('theme')}catch(e){}
  const apply=v=>{root.dataset.theme=v;btn.textContent=v==='dark'?'☀ Light':'☾ Dark'};
  apply(t||sys());
  btn.onclick=()=>{const v=root.dataset.theme==='dark'?'light':'dark';apply(v);try{localStorage.setItem('theme',v)}catch(e){}};
})();
sideWire();load();
</script>

</html>
